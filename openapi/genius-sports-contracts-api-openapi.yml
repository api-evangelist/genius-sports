components:
  schemas:
    Empty:
      type: object
    JsonbModelViewModel:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the property.
          title: Property name
        value:
          type: string
          description: Value of the property.
          title: Property value
      title: Create/Update Property Model
      description: This model should be used to create or update single property value for specific property name for specific model.
    CompetitorContractResponseModelHATEOASReponseModel:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompetitorContractResponseModel'
        self:
          type: string
        previous:
          type: string
        next:
          type: string
        first:
          type: string
        last:
          type: string
    JsonbModel:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isDeleted:
          type: boolean
    PersonContractResponseModel:
      type: object
      required:
      - competitor
      - createdOn
      - id
      - isActive
      - personRole
      - sport
      - updatesCount
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
          format: date-time
        modifiedOn:
          type: string
          format: date-time
        updatesCount:
          type: integer
          format: int32
        competitor:
          $ref: '#/components/schemas/CompetitorHALEmbededResponse'
        sport:
          $ref: '#/components/schemas/HALEmbededResponse'
        personRole:
          type: string
        isActive:
          type: boolean
          description: Whether the relation between the person and the competitor is active
          title: Is Active
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    CompetitorContractResponseModel:
      type: object
      required:
      - createdOn
      - id
      - isActive
      - person
      - personRole
      - sport
      - updatesCount
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
          format: date-time
        modifiedOn:
          type: string
          format: date-time
        updatesCount:
          type: integer
          format: int32
        person:
          $ref: '#/components/schemas/PersonHALEmbededResponse'
        sport:
          $ref: '#/components/schemas/HALEmbededResponse'
        player:
          $ref: '#/components/schemas/HALEmbededResponse'
        personRole:
          type: string
        isActive:
          type: boolean
          description: Whether the relation between the person and the competitor is active
          title: Is Active
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        metadataProperties:
          type: array
          description: In order to retrieve allowed metadata properties with their values execute get request on this path - /sports/{id}/contract/metadata
          items:
            $ref: '#/components/schemas/JsonbModel'
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
    ErrorModel:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    CompetitorPersonRoleType:
      type: integer
      format: int32
      description: 0 - Owned By (e.g. Competitor Horse owned by Person, Competitor Team owned by Person); 1 - PlaysFor (e.g. Person plays for Competitor Team); 3 - Trained By (e.g. Competitor is trained by Person); 5 - RiddenBy (e.g. Competitor Horse is ridden by Person (the person is the jockey); 6 - BredBy (e.g. Competitor Horse is bred by Person))
      enum:
      - '0'
      - '1'
      - '3'
      - '5'
      - '6'
    BadRequestModel:
      type: object
      properties:
        messages:
          type: array
