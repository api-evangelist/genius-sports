components:
  schemas:
    Empty:
      type: object
    proposalFixture:
      type: object
      properties:
        id:
          type: string
        sourceEntityId:
          type: string
        sourceName:
          type: string
        status:
          type: string
        data:
          $ref: '#/components/schemas/proposalFixtureIngestionData'
    teamMatchModel:
      allOf:
      - $ref: '#/components/schemas/baseMatchModel'
      - properties:
          gender:
            $ref: '#/components/schemas/gender'
          ageCategory:
            $ref: '#/components/schemas/ageCategory'
          locality:
            $ref: '#/components/schemas/locality'
          teamPropertiesModel:
            $ref: '#/components/schemas/teamPropertiesModel'
    fixtureMatchModel:
      allOf:
      - $ref: '#/components/schemas/baseMatchModel'
      - properties:
          startDate:
            type: string
            format: date-time
            description: The start date of the fixture in UTC ISO-8601 format. (yyyy-MM-ddTHH:mmZ)
            title: Start Date
          startDateUnreliable:
            type: boolean
            description: Whether the start date is unreliable or not. If true, the start date is not reliable and it will be ignored for updates.
            title: Start Date Unreliable
          locality:
            $ref: '#/components/schemas/locality'
          eventStatus:
            type: string
            description: Notstarted, Inprogress, Finished, Cancelled, Postponed.
          sportSpecificRules:
            $ref: '#/components/schemas/sportSpecificRules'
          matchNumber:
            type: string
          atNeutralVenue:
            type: boolean
    competitionIngestion:
      type: object
      required:
      - competition
      - sport
      properties:
        organization:
          $ref: '#/components/schemas/organizationMatchModel'
        competition:
          $ref: '#/components/schemas/competitionMatchModel'
        sport:
          $ref: '#/components/schemas/baseMatchModel'
        competitionPhases:
          type: array
          items:
            $ref: '#/components/schemas/competitionPhaseMatchModel'
    official:
      allOf:
      - $ref: '#/components/schemas/baseMatchModel'
      - properties:
          gender:
            $ref: '#/components/schemas/gender'
          firstName:
            type: string
          lastName:
            type: string
          role:
            type: string
            description: The role of the official
          birthDate:
            type: string
            format: date-time
            description: Official birthdate in format - full-date notation, for example, 2017-07-21
            title: Birth Date
          locality:
            $ref: '#/components/schemas/locality'
    proposalCompetitionData:
      allOf:
      - $ref: '#/components/schemas/proposalDataBase'
      - type: object
        properties:
          gender:
            type: string
          competitionType:
            type: string
          startDate:
            type: string
          endDate:
            type: string
          locality:
            $ref: '#/components/schemas/proposalLocalityData'
    playerMatchModel:
      type: object
      properties:
        birthDate:
          type: string
          format: date-time
          description: Player birthdate in format - full-date notation as defined by RFC 3339, section 5.6, for example, 2017-07-21
          title: Birth Date
        sourceEntityId:
          type: string
          description: Source entity unique Id
          title: The external id from Genius Sports perspective and the internal for the source. By sending this param the backtracking capabilities improved, via push & pull.
        position:
          type: string
          description: The playing position, depending on the sport.
        shirtNumber:
          type: number
          description: The number of the Shirt for the player
        locality:
          $ref: '#/components/schemas/locality'
        playerPropertiesModel:
          $ref: '#/components/schemas/firstLastNameModel'
        gender:
          $ref: '#/components/schemas/gender'
        name:
          type: string
          description: The full name of the player
        sourceMetadata:
          type: object
          description: Source metadata
          title: An additional collection of metadata supplied by the source.
          additionalProperties:
            type: string
        id:
          type: string
          description: Genius Sport Id
          title: If client has the Genius Sport Id it can be sent to improve overall matching capabilities and certainty or the results.
    coverageData:
      type: object
      properties:
        type:
          type: string
          description: The coverage source.
        liveData:
          type: boolean
          description: Whether the entity has live data coverage.
        liveVideo:
          type: boolean
          description: Whether the entity has live video coverage.
    venueMatchModel:
      allOf:
      - $ref: '#/components/schemas/baseMatchModel'
      - properties:
          locality:
            $ref: '#/components/schemas/locality'
          city:
            type: string
            description: The city of the venue
          parentVenue:
            $ref: '#/components/schemas/baseMatchModel'
    gender:
      type: string
      title: 'One of: Male, Female, Mixed. If the entity is neither Male, nor Female use Mixed.'
      description: If sent an EXACT match is made on the enum, excluding all non-matching entities.
    lineupPlayer:
      allOf:
      - $ref: '#/components/schemas/baseMatchModel'
      - properties:
          gender:
            $ref: '#/components/schemas/gender'
          locality:
            $ref: '#/components/schemas/locality'
          playerPropertiesModel:
            $ref: '#/components/schemas/basePlayerPropertiesModel'
          isStarter:
            type: boolean
            description: Indicates if the player is a starter in the lineup.
          order:
            type: integer
            description: The order of the player in the lineup, starting from 0.
          position:
            type: string
            description: The position of the player in the lineup, e.g., 'Forward', 'Keeper'.
          shirtNumber:
            type: string
            description: The shirt number of the player in the lineup.
    proposalLocalityData:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    officialsReadonlyResponseModel:
      type: array
      items:
        $ref: '#/components/schemas/officialReadonlyResponseModel'
    playerPropertiesModel:
      allOf:
      - $ref: '#/components/schemas/basePlayerPropertiesModel'
      - properties:
          sourceEntityId:
            type: string
            description: Source entity unique Id
            title: The external id from Genius Sports perspective and the internal for the source. By sending this param the backtracking capabilities improved, via push & pull.
          id:
            type: string
            description: Genius Sport Id
            title: If client has the Genius Sport Id it can be sent to improve overall matching capabilities and certainty or the results.
    competitionPhaseReadonlyResponseModel:
      allOf:
      - $ref: '#/components/schemas/baseResponseMatchModel'
      - properties:
          startDate:
            type: string
            format: date-time
          endDate:
            type: string
            format: date-time
    proposalSeasonData:
      allOf:
      - $ref: '#/components/schemas/proposalDataBase'
      - type: object
        properties:
          startDate:
            type: string
            format: date-time
          endDate:
            type: string
            format: date-time
    proposalOfficialData:
      allOf:
      - $ref: '#/components/schemas/proposalDataBase'
      - type: object
        properties:
          firstName:
            type: string
          lastName:
            type: string
          role:
            type: string
    competitionResponseMatchModel:
      type: object
      required:
      - competition
      - sport
      properties:
        sport:
          $ref: '#/components/schemas/baseResponseMatchModel'
        organization:
          $ref: '#/components/schemas/organizationReadonlyResponseModel'
        competition:
          $ref: '#/components/schemas/competitionReadonlyResponseModel'
        season:
          $ref: '#/components/schemas/baseResponseMatchModel'
        competitionPhases:
          type: array
          items:
            $ref: '#/components/schemas/competitionPhaseReadonlyResponseModel'
    firstLastNameModel:
      type: object
      properties:
        firstName:
          type: string
          description: The first name of the competitor
        lastName:
          type: string
          description: The last name of the competitor
    proposalVenueData:
      allOf:
      - $ref: '#/components/schemas/proposalDataBase'
      - type: object
        properties:
          locality:
            type: string
          city:
            type: string
    competitionTrackingStatusResponse:
      type: object
      properties:
        requestCuratedValue:
          $ref: '#/components/schemas/competitionResponseMatchModel'
        status:
          $ref: '#/components/schemas/SimplifiedTrackingStatus'
