components:
  schemas:
    Empty:
      type: object
    JsonbModelViewModel:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the property.
          title: Property name
        value:
          type: string
          description: Value of the property.
          title: Property value
      title: Create/Update Property Model
      description: This model should be used to create or update single property value for specific property name for specific model.
    PatchFixture:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the fixture.
          title: Id
        startDate:
          type: string
          format: date-time
          description: The start date of the fixture in UTC ISO-8601 format
          title: Start Date
        venueId:
          type: integer
          format: int64
          description: The ID of the venue the fixture is played at.
          title: Venue ID
        roundId:
          type: integer
          format: int64
          description: The ID of the round the fixture is for.
          title: Round ID
        metadataProperties:
          type: array
          description: In order to retrieve allowed metadata properties with their values execute get request on this path - /sports/{id}/competition/metadata
          title: metadataProperties
          items:
            $ref: '#/components/schemas/JsonbModelViewModel'
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
      title: Patch Fixture Model
      description: This model should be used to propose a partial update/patch to a fixture.
    JsonbModel:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isDeleted:
          type: boolean
    FixtureLineupsResponseModel:
      type: object
      required:
      - confirmed
      - createdOn
      - id
      - lineupPlayers
      - updatesCount
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
          format: date-time
        modifiedOn:
          type: string
          format: date-time
        updatesCount:
          type: integer
          format: int32
        fixture:
          $ref: '#/components/schemas/HALEmbededResponse'
        confirmed:
          type: boolean
        homeTeam:
          $ref: '#/components/schemas/LineupTeamResponseModel'
        awayTeam:
          $ref: '#/components/schemas/LineupTeamResponseModel'
        lineupPlayers:
          type: array
          items:
            $ref: '#/components/schemas/LineupPlayerResponseModel'
    ErrorModel:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    FixtureRefdataSeason:
      type: object
      properties:
        id:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        name:
          type: string
    FixtureRefdataVenue:
      type: object
      properties:
        id:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        name:
          type: string
    FixtureRefdataFixture:
      type: object
      properties:
        id:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        startDate:
          type: string
          format: date-time
        metadataProperties:
          type: array
          items:
            $ref: '#/components/schemas/JsonbModel'
        competitors:
          type: array
          items:
            $ref: '#/components/schemas/FixtureRefdataCompetitor'
        season:
          $ref: '#/components/schemas/FixtureRefdataSeason'
        venue:
          $ref: '#/components/schemas/FixtureRefdataVenue'
        competition:
          $ref: '#/components/schemas/FixtureRefdataCompetition'
    CreateFixture:
      type: object
      required:
      - competitors
      - seasonId
      - startDate
      properties:
        seasonId:
          type: integer
          format: int64
          description: The ID of the season to fixture belongs to.
          title: Season Id
        competitors:
          type: array
          description: Array of competitors to be added to the fixture.
          title: Competitors
          items:
            type: integer
            description: Competitors which belong to the fixture.
            title: Competitors
        homeCompetitorId:
          type: integer
          format: int64
          description: 'The ID of the competitor from the competitors list to be marked as home competitor of the fixture. Can only be updated if set to TBD competitor. By default if home competitor is not sent, the competitor which is first in the competitors list will be marked as home competitor. E.g. If you send competitors: [3,2,1], competitor with id 3 will be set as home competitor. If you send competitors: [1, 2, 3], competitor with id 1 will be marked as home competitor'
          title: Home Competitor Id
        startDate:
          type: string
          format: date-time
          description: The start date of the fixture in UTC ISO-8601 format
          title: Start Date
        roundId:
          type: integer
          format: int64
          description: The ID of the round the fixture belongs to.
          title: Round ID
        venueId:
          type: integer
          format: int64
          description: The ID of the venue the fixture is played at.
          title: Venue ID
        localityId:
          type: integer
          format: int64
          description: The ID of the country/region/administrative zone the fixture is played at.
          title: Locality ID
        name:
          type: string
          description: Optionally a name can be posted, which will override the default Competitor one V Competitor two logic. It's applicable for non two competitor sports
          title: Name
          maxLength: 250
        metadataProperties:
          type: array
          description: In order to retrieve allowed metadata properties with their values execute get request on this path - /sports/{id}/fixture/metadata
          title: metadataProperties
          items:
            $ref: '#/components/schemas/JsonbModelViewModel'
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        matchDay:
          type: integer
          format: int32
        attendance:
          type: integer
          format: int32
      title: Create Fixture Model
      description: This model should be used to propose a new fixture.
    BadRequestModel:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
    CreatePersonViewModel:
      type: object
      required:
      - firstName
      - genderType
      - lastName
      - localityId
      - useNickname
      properties:
        firstName:
          type: string
          description: The first name of the person
          title: First Name
          maxLength: 256
        lastName:
          type: string
          description: The last name of the person
          title: Last Name
          maxLength: 256
        nickName:
          type: string
          description: The nickname of the person
          title: Nickname
          maxLength: 128
        useNickname:
          type: boolean
          description: Whether the nickname should be used instead of the name of the person when displaying the person. If the useNickname property is set to true nickname is required!
          title: Is active
        localityId:
          type: integer
          format: int64
          description: Id of the country,virtual place, etc. of the person!
          title: Locality Id
        dateOfBirth:
          type: string
          format: date-time
          description: The date of birth of the person
          title: Date of birth
        genderType:
          $ref: '#/components/schemas/PersonGenderType'
        sports:
          type: array
          description: Array of sport Ids to be added to the person.
          title: Sports
          items:
            type: integer
            description: Sports to which the person belongs to.
            title: Sports
    Error:
      type: object
      required:
      - domain
      - message
      - reason
      properties:
        reason:
          type: string
        domain:
          type: string
        locationType:
          type: string
        location:
          type: string
        message:
          type: string
    LineupTeamResponseModel:
      allOf:
      - $ref: '#/components/schemas/CompetitorHALEmbededResponse'
      - properties:
          formation:
            type: string
            description: The team formation for the current lineup
            title: Team formation in the lineup, e.g. 4-4-2
    CreateFixtureOfficial:
      type: object
      properties:
        personId:
          type: integer
          format: int64
          description: Id of the person which will be added as fixture official
          minimum: 1.0
        person:
          description: Person information if not been created early, if the person already exists - leave empty.
          $ref: '#/components/schemas/CreatePersonViewModel'
        metadataProperties:
          type: array
          description: In order to retrieve allowed metadata properties with their values execute get request on this path - /sports/{id}/fixtureperson/metadata
          title: metadataProperties
          items:
            $ref: '#/components/schemas/JsonbModelViewModel'
    FixtureOfficialResponseModelHATEOASReponseModel:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/FixtureOfficialResponseModel'
        self:
          type: string
        previous:
          type: string
        next:
          type: string
        first:
          type: string
        last:
          type: string
    FixtureRefdataCompetitor:
      type: object
      properties:
        id:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        name:
          type: string
        isHome:
          type: boolean
        formation:
          type: string
        lineup:
          type: array
          items:
            $ref: '#/components/schemas/FixtureRefdataLineupPlayer'
    PersonGenderType:
      type: integer
      title: Gender Type
      format: int32
      description: 'This property defines the possible person gender types which can be set as integer values. Each integer value is associated with relevant gender type as follows: 0 - Undefined; 1 - Male; 2 - Female;'
      enum:
      - '0'
      - '1'
      - '2'
    FixtureCompetitorHALEmbededResponse:
      type: object
      required:
      - competitorType
      - id
      - name
      - ref
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        competitorType:
          type: string
          description: Team, Player, Horse, Jockey, HorseOwner, Dog, Breeder, DoublesPartnership, Other, TBD
