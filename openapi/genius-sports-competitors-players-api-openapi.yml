components:
  schemas:
    CreatePlayerCompetitor:
      type: object
      required:
      - sportId
      properties:
        metadataProperties:
          type: array
          items:
            $ref: '#/components/schemas/JsonbModelViewModel'
        personId:
          type: integer
          format: int64
          description: If the person is already existing set its Id, otherwise leave it empty and populate the person object
          minimum: 1.0
        sportId:
          type: integer
          format: int64
          description: Id of the sport in which the competitor can be used
          minimum: 1.0
        person:
          description: Person information if not been created early, if the person already exists - leave empty.
          $ref: '#/components/schemas/CreatePersonViewModel'
    CompetitorStatusType:
      type: integer
      title: Competitor Status Type
      format: int32
      description: 'This property defines the possible status types which can be set as integer values. Each integer value is associated with relevant status type as follows: 0 - Active; 1 - Retired; 2 - Unattached.'
      enum:
      - '0'
      - '1'
      - '2'
    HALEmbededResponse:
      type: object
      required:
      - id
      - name
      - ref
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        ref:
          type: string
    JsonbModelViewModel:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the property.
          title: Property name
        value:
          type: string
          description: Value of the property.
          title: Property value
      title: Create/Update Property Model
      description: This model should be used to create or update single property value for specific property name for specific model.
    PlayerCompetitorResponseModel:
      type: object
      required:
      - competitorStatusType
      - createdOn
      - id
      - name
      - person
      - sport
      - updatesCount
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
          format: date-time
        modifiedOn:
          type: string
          format: date-time
        updatesCount:
          type: integer
          format: int32
        metadataProperties:
          type: array
          items:
            $ref: '#/components/schemas/JsonbModel'
        externalIds:
          $ref: '#/components/schemas/ExternalIdsViewModel'
        name:
          type: string
        sport:
          $ref: '#/components/schemas/HALEmbededResponse'
        genderType:
          type: string
        locality:
          $ref: '#/components/schemas/HALEmbededResponse'
        competitorStatusType:
          type: string
        person:
          $ref: '#/components/schemas/PersonForPlayerResponseModel'
        isProtected:
          type: boolean
          description: Whether the competitor is protected or not.
    CompetitorRoundsResponseModelHATEOASReponseModel:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompetitorRoundsResponseModel'
        self:
          type: string
        previous:
          type: string
        next:
          type: string
        first:
          type: string
        last:
          type: string
    AcceptedModel:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
    UpdatePlayerCompetitor:
      type: object
      required:
      - competitorStatusType
      - id
      properties:
        metadataProperties:
          type: array
          items:
            $ref: '#/components/schemas/JsonbModelViewModel'
        id:
          type: integer
          format: int64
          minimum: 1.0
        competitorStatusType:
          $ref: '#/components/schemas/CompetitorStatusType'
    ErrorModel:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        error:
          $ref: '#/components/schemas/Error'
    PersonGenderType:
      type: integer
      title: Gender Type
      format: int32
      description: 'This property defines the possible person gender types which can be set as integer values. Each integer value is associated with relevant gender type as follows: 0 - Undefined; 1 - Male; 2 - Female;'
      enum:
      - '0'
      - '1'
      - '2'
    BadRequestModel:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
    ErrorDuplicateModel:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
        geniusSportsConflictId:
          type: string
          description: This is the official genius sports ID, which you have conflict with.
    CompetitorSeasonsResponseModel:
      type: object
      required:
      - id
      - name
      - ref
      properties:
        id:
          type: integer
          format: int64
          description: Id of the season
        name:
          type: string
          description: Name of the season
        ref:
          type: string
          description: Endpoint to season
    Error:
      type: object
      required:
      - domain
      - message
      - reason
      properties:
        reason:
          type: string
        domain:
          type: string
        locationType:
          type: string
        location:
          type: string
        message:
          type: string
    ExternalIdsViewModel:
      type: object
      properties:
        optaId:
          type: string
        optaLegacyId:
          type: string
        fibaId:
          type: string
        vesselId:
          type: string
        statsEngineId:
          type: string
      description: External system identifiers. Key represents the external system name (e.g., 'optaId', 'optaLegacyId', 'fibaId', 'vesselId','statsEngineId'), value represents the identifier. The property also allows filtering by specific external system identifiers. For example '?filter=externalIds.optaId[equals]:12345' to filter entities with a specific Opta ID.
    CreatePersonViewModel:
      type: object
      required:
      - firstName
      - genderType
      - lastName
      - localityId
      - useNickname
      properties:
        firstName:
          type: string
          description: The first name of the person
          title: First Name
          maxLength: 256
        lastName:
          type: string
          description: The last name of the person
          title: Last Name
          maxLength: 256
        nickName:
          type: string
          description: The nickname of the person
          title: Nickname
          maxLength: 128
        useNickname:
          type: boolean
          description: Whether the nickname should be used instead of the name of the person when displaying the person. If the useNickname property is set to true nickname is required!
          title: Is active
        localityId:
          type: integer
          format: int64
          description: Id of the country,virtual place, etc. of the person!
          title: Locality Id
        dateOfBirth:
          type: string
          format: date-time
          description: The date of birth of the person
          title: Date of birth
        genderType:
          $ref: '#/components/schemas/PersonGenderType'
        sports:
          type: array
          description: Array of sport Ids to be added to the person.
          title: Sports
          items:
            type: integer
            description: Sports to which the person belongs to.
            title: Sports
    CompetitorSeasonsResponseModelHATEOASReponseModel:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompetitorSeasonsResponseModel'
        self:
          type: string
        previous:
          type: string
        next:
          type: string
        first:
          type: string
        last:
          type: string
    JsonbModel:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isDeleted:
          type: boolean
    CompetitorRoundsResponseModel:
      type: object
      required:
      - genderType
      - id
      - name
      - ref
      properties:
        id:
          type: integer
          format: int64
          description: Id of the round
        name:
          type: string
          description: Name of the round
        ref:
          type: string
          description: Endpoint to round
        genderType:
          type: string
          description: Gender of the competitor
        locality:
          $ref: '#/components/schemas/HALEmbededResponse'
    PersonForPlayerResponseModel:
      type: object
      required:
      - createdOn
      - firstName
      - fullName
      - genderType
      - id
      - isActive
      - lastName
      - locality
      - ref
      - updatesCount
      - useNickname
      properties:
        id:
          type: integer
          format: int64
        createdOn:
          type: string
