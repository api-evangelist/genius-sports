basePath: /v2
schemes:
- https
tags:
- name: Competitions
paths:
  /competitions:
    options:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: 200 response
          schema:
            $ref: '#/definitions/Empty'
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      tags:
      - Competitions
    get:
      tags:
      - Competitions
      summary: Retrieve competition by ID/s. MAX 200 per page.
      description: Returns competitions wrapped inside a HATEOAS model
      produces:
      - application/json
      parameters:
      - name: page
        in: query
        description: The number of page to be returned. The default value is 1.
        required: false
        type: string
      - name: pageSize
        in: query
        description: The size of the page to be returned. The default value is 10.
        required: false
        type: string
      - name: sortBy
        in: query
        description: 'The field to ''order by'' by. Descending ordering also allowed. Fields to order by for this endpoint: (id, name, sportId, genderType, localityId)'
        required: false
        type: string
      - name: x-api-key
        in: header
        required: true
        type: string
      - name: filter
        in: query
        description: 'The field to ''filter'' by. Check main description for filter comparators. Fields to filter by for this endpoint: (id, name, sportId, genderType, localityId)'
        required: false
        type: string
      responses:
        '200':
          description: successful operation
          schema:
            $ref: '#/definitions/CompetitionResponseModelHATEOASReponseModel'
          headers:
            Access-Control-Allow-Origin:
              type: string
        '520':
          description: Unknown error
          schema:
            $ref: '#/definitions/ErrorModel'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/BadRequestModel'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorModel'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorModel'
        '413':
          description: Payload Too Large
          schema:
            $ref: '#/definitions/ErrorModel'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorModel'
        '415':
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorModel'
        '429':
          description: Too Many Requests  OR  Limit Exceeded  - On reason = Too Many requests one should re-try, for Limit Exceeded that does not help you
          schema:
            $ref: '#/definitions/ErrorModel'
      security:
      - Auth0: []
      - api_key: []
    post:
      tags:
      - Competitions
      summary: Create new competition
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: x-api-key
        in: header
        required: true
        type: string
      - name: gs-fixtures-api-sub-source
        in: header
        description: Sub Source Name
        required: false
        type: string
      - in: body
        name: CreateCompetition
        required: true
        schema:
          $ref: '#/definitions/CreateCompetition'
      responses:
        '520':
          description: Unknown error
          schema:
            $ref: '#/definitions/ErrorModel'
        '201':
          description: Created
          schema:
            $ref: '#/definitions/CompetitionResponseModel'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/BadRequestModel'
        '202':
          description: Accepted
          schema:
            $ref: '#/definitions/AcceptedModel'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorModel'
        '429':
          description: Too Many Requests  OR  Limit Exceeded  - On reason = Too Many requests one should re-try, for Limit Exceeded that does not help you
          schema:
            $ref: '#/definitions/ErrorModel'
        '409':
          description: Conflict, see the response message or the 'geniussports-conflict-id' header to see the ID of the conflict!
          schema:
            $ref: '#/definitions/ErrorDuplicateModel'
      security:
      - Auth0: []
      - api_key: []
    put:
      tags:
      - Competitions
      summary: Update existing competition
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: x-api-key
        in: header
        required: true
        type: string
      - name: gs-fixtures-api-sub-source
        in: header
        description: Sub Source Name
        required: false
        type: string
      - in: body
        name: UpdateCompetition
        required: true
        schema:
          $ref: '#/definitions/UpdateCompetition'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/CompetitionResponseModel'
        '520':
          description: Unknown error
          schema:
            $ref: '#/definitions/ErrorModel'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/BadRequestModel'
        '202':
          description: Accepted
          schema:
            $ref: '#/definitions/AcceptedModel'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorModel'
        '409':
          description: Conflict, see the response message or the 'geniussports-conflict-id' header to see the ID of the conflict!
          schema:
            $ref: '#/definitions/ErrorDuplicateModel'
      security:
      - Auth0: []
      - api_key: []
    patch:
      tags:
      - Competitions
      summary: Patch existing competition
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: x-api-key
        in: header
        required: true
        type: string
      - name: gs-fixtures-api-sub-source
        in: header
        description: Sub Source Name
        required: false
        type: string
      - in: body
        name: PatchCompetition
        required: true
        schema:
          $ref: '#/definitions/PatchCompetition'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/CompetitionResponseModel'
        '520':
          description: Unknown error
          schema:
            $ref: '#/definitions/ErrorModel'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/BadRequestModel'
        '202':
          description: Accepted
          schema:
            $ref: '#/definitions/AcceptedModel'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorModel'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/ErrorModel'
        '504':
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/ErrorModel'
        '409':
          description: Conflict, see the response message or the 'geniussports-conflict-id' header to see the ID of the conflict!
          schema:
            $ref: '#/definitions/ErrorDuplicateModel'
      security:
      - Auth0: []
      - api_key: []
  /competitions/{id}:
    options:
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - name: id
        in: path
        required: true
        type: string
      responses:
        '200':
          description: 200 response
          schema:
            $ref: '#/definitions/Empty'
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      tags:
