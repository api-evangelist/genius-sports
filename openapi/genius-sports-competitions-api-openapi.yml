          title: Competition timezone
        shortName:
          type: string
          description: A short name for the competition
          title: Competition short name
          maxLength: 250
        longName:
          type: string
          description: A long name for the competition
          title: Competition long name
          maxLength: 500
        sponsorName:
          type: string
