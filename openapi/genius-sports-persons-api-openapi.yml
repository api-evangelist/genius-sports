definitions:
  BadRequestModel:
    type: object
    properties:
      messages:
        type: array
        items:
          type: string
  Error:
    type: object
    required:
    - domain
    - message
    - reason
    properties:
      reason:
        type: string
      domain:
        type: string
      locationType:
        type: string
      location:
        type: string
      message:
        type: string
  CreatePersonViewModel:
    type: object
    required:
    - firstName
    - genderType
    - lastName
    - localityId
    - useNickname
    properties:
      firstName:
        type: string
        description: The first name of the person
        title: First Name
        maxLength: 256
      lastName:
        type: string
        description: The last name of the person
        title: Last Name
        maxLength: 256
      nickName:
        type: string
        description: The nickname of the person
        title: Nickname
        maxLength: 128
      useNickname:
        type: boolean
        description: Whether the nickname should be used instead of the name of the person when displaying the person. If the useNickname property is set to true nickname is required!
        title: Is active
      localityId:
